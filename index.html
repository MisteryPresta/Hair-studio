<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hair Designer">
    <meta name="theme-color" content="#d7d3c8">
    <title>Hair Designer Game</title>
    <meta name="description" content="A kid-friendly, touch-ready 2D drawing game where the player paints a doll’s hair using a brush and a color palette. The game is self-contained in a single HTML file and runs instantly in the browser, featuring masking, undo/redo, style guides, and image saving.">
    <meta property="og:title" content="Hair Designer Game">
    <meta property="og:description" content="A kid-friendly, touch-ready 2D drawing game where the player paints a doll’s hair using a brush and a color palette. The game is self-contained in a single HTML file and runs instantly in the browser, featuring masking, undo/redo, style guides, and image saving.">
    <!--
      Hair Designer - A single-file HTML5 Canvas Game
      Expertly crafted for Gemini by a world-class senior frontend React engineer.
      This file is self-contained with no external dependencies.
    -->
    <style>
      /* --- 1. General Layout & Resets --- */
      :root {
        --bg-color: #d7d3c8;
        --canvas-bg: #d7d3c8;
        --primary-accent: #967156;
        --secondary-accent: #87ceeb; /* Sky Blue */
        --ui-bg: #c9c5ba;
        --ui-border: #d1d9e6;
        --text-color: #333;
        --text-light: #666;
        --button-hover: #eef2f7;
        --button-active: #d1d9e6;
        --disabled-color: #a0a0a0;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        font-size: 16px;
      }

      :root.dark {
        --bg-color: #292b37;
        --canvas-bg: #292b37;
        --primary-accent: #967156;
        --secondary-accent: #5db0db; /* Sky Blue */
        --ui-bg: #1a1c24;
        --ui-border: #2e3440;
        --text-color: #e5e9f0;
        --text-light: #9ba3b2;
        --button-hover: #242933;
        --button-active: #2e3440;
        --disabled-color: #4c566a;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        touch-action: none; /* Prevents scrolling on mobile */
      }

      /* --- 2. Main App Structure --- */
      #app-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0.5rem;
      }

      #header-area {
        width: 100%;
        max-width: 1024px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        margin-bottom: 0.5rem;
        padding: 0 0.5rem;
      }

      div#app-container > div#header-area > h1,
      h1 {
        font-size: 1.5rem;
        color: var(--primary-accent);
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        margin: 0;
        text-align: center;
      }

      #theme-toggle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--ui-border);
        background-color: var(--ui-bg);
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
        box-shadow: var(--shadow);
        padding: 0;
      }

      #theme-toggle:hover {
        transform: scale(1.08);
        background-color: var(--button-hover);
        border-color: var(--secondary-accent);
      }

      #theme-toggle:active {
        transform: scale(0.95);
        background-color: var(--button-active);
      }

      #theme-toggle svg {
        width: 20px;
        height: 20px;
      }

      #canvas-wrapper {
        position: relative;
        width: 100%;
        max-width: 1024px;
        aspect-ratio: 1024 / 768; /* Enforce 4:3 aspect ratio */
        box-shadow: var(--shadow);
        border-radius: 16px;
        overflow: hidden;
        background-color: var(--canvas-bg);
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }

      /* --- 3. UI Panels & Toolbars --- */
      #ui-container {
        width: 100%;
        max-width: 1024px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      
      .ui-panel {
        background: var(--ui-bg);
        border-radius: 12px;
        padding: 0.5rem;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* --- 4. Buttons & Controls --- */
      .tool-btn, .control-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        min-width: 60px;
        height: 60px;
        padding: 0.5rem;
        border: 2px solid transparent;
        border-radius: 8px;
        background-color: transparent;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-light);
      }

      .tool-btn svg, .control-btn svg {
        width: 28px;
        height: 28px;
      }
      
      .tool-btn.active {
        background-color: var(--button-hover);
        border-color: var(--secondary-accent);
        color: var(--text-color);
      }
      
      .tool-btn:hover:not(:disabled), .control-btn:hover:not(:disabled) {
        background-color: var(--button-hover);
      }

      .tool-btn:active, .control-btn:active {
        background-color: var(--button-active);
      }

      .tool-btn:disabled, .control-btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      
      .divider {
        width: 2px;
        height: 48px;
        background-color: var(--ui-border);
        border-radius: 1px;
        margin: 0 0.25rem;
      }

      /* --- 5. Color Palette & Brush Preview --- */
      #color-palette {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 400px;
      }

      .color-swatch {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid var(--ui-border);
        transition: transform 0.2s, border-color 0.2s;
      }

      .color-swatch:hover {
        transform: scale(1.1);
      }

      .color-swatch.active {
        border-color: var(--primary-accent);
        transform: scale(1.2);
        box-shadow: 0 0 8px var(--primary-accent);
      }

      #brush-preview-wrapper {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      #brush-preview {
        width: 60px;
        height: 60px;
        border: 1px solid var(--ui-border);
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--canvas-bg);
        overflow: hidden;
        position: relative;
      }
      
      #brush-preview-canvas {
        display: block;
        width: 56px;
        height: 56px;
      }

      /* --- 6. Onboarding & Modals --- */
      #onboarding-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      
      #onboarding-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      
      .onboarding-modal {
        background: var(--ui-bg);
        color: var(--text-color);
        border: 1px solid var(--ui-border);
        padding: 2rem;
        border-radius: 16px;
        text-align: center;
        max-width: 90%;
        width: 400px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      }
      
      .onboarding-modal h2 {
        margin-top: 0;
        color: var(--primary-accent);
      }

      .onboarding-modal button {
        background: var(--primary-accent);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 1rem;
        transition: background-color 0.2s;
      }
      .onboarding-modal button:hover {
        background: #e05daa;
      }

      /* --- 7. Status & Misc --- */
      #status-strip {
        font-size: 0.8rem;
        color: var(--text-light);
        text-align: center;
      }

    </style>
</head>
<body>

  <!-- Main Application Container -->
  <div id="app-container">
    <div id="header-area">
      <div></div> <!-- Left spacing for perfect center alignment of title -->
      <h1>Hair Designer</h1>
      <div style="display: flex; justify-content: flex-end;">
        <button id="theme-toggle" title="Toggle Dark Mode">
          <!-- Sun icon (shown in light mode, toggles to dark) -->
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>

            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>

            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

          <!-- Moon icon (shown in dark mode, toggles to light) -->
          <svg id="theme-icon-dark" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

    </div>
    <div id="canvas-wrapper">
      <canvas id="display-canvas"></canvas>
    </div>
    <div id="ui-container">
      <div id="status-strip">Select a tool and color to start!</div>
      <div class="ui-panel">
          <!-- Tools -->
          <button id="tool-brush" class="tool-btn active" title="Brush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg><span>Brush</span></button>
          <button id="tool-eraser" class="tool-btn" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a2.1 2.1 0 0 0-2.97 0L7.5 14.53l-2.44 2.44a2.1 2.1 0 0 0 0 2.97l2.97 2.97a2.1 2.1 0 0 0 2.97 0L20.42 7.55a2.1 2.1 0 0 0 0-2.97zM10.5 17.5l-2-2M13.5 14.5l-2-2"></path></svg><span>Eraser</span></button>
          <div class="divider"></div>
          <!-- Brush Sizes -->
          <button id="brush-small" class="tool-btn" title="Small Brush"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"></circle></svg><span>Small</span></button>

            <div id="brush-preview" title="Live Hair Texture Brush Preview"><canvas id="brush-preview-canvas" width="56" height="56"></canvas></div>
          </div>
          <div class="divider"></div>
          <!-- Hair Textures -->
          <button id="texture-strands" class="tool-btn active" title="Fine Hair Strands Texture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3c1 6-1 12 0 18M9 3c1.5 6-.5 12 1 18M13 3c1 6-1 12 0 18M17 3c1.5 6-.5 12 1 18M21 3c1 6-1 12 0 18"/></svg><span>Strands</span></button>
          <button id="texture-silky" class="tool-btn" title="Silky Lustrous Hair Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3c3 5 4 11 0 18M12 3c3 5 4 11 0 18M18 3c3 5 4 11 0 18"/></svg><span>Silky</span></button>
          <button id="texture-wavy" class="tool-btn" title="Wavy Hair Flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3c2 4-2 7 0 10s-2 6 0 8M12 3c2 4-2 7 0 10s-2 6 0 8M19 3c2 4-2 7 0 10s-2 6 0 8"/></svg><span>Wavy</span></button>

          <div class="divider"></div>
          <!-- Undo/Redo -->
          <button id="undo-btn" class="control-btn" title="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9H8a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h10"></path><polyline points="12 13 8 9 12 5"></polyline></svg><span>Undo</span></button>
          <button id="redo-btn" class="control-btn" title="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h13a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H4"></path><polyline points="12 5 16 9 12 13"></polyline></svg><span>Redo</span></button>
      </div>
      <div class="ui-panel">
        <div id="color-palette"></div>

       <div class="ui-panel">
          <!-- Hair Types (Straight, Wavy, Curly, Kinky) -->

          <button id="guide-wavy" class="tool-btn" title="Wavy Hair (Type 2 - Loose S-Waves)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3c2.5 3-2.5 6 0 9s2.5 6 0 9M12 3c2.5 3-2.5 6 0 9s2.5 6 0 9M18 3c2.5 3-2.5 6 0 9s2.5 6 0 9"/></svg><span>Wavy</span></button>

  <!-- Onboarding Modal -->
  <div id="onboarding-overlay">
    <div class="onboarding-modal">
      <h2 id="onboarding-title">Welcome to Hair Designer!</h2>

      <button id="onboarding-next">Got it!</button>

<script>
// --- Wrap entire script in a DOMContentLoaded listener ---
document.addEventListener('DOMContentLoaded', () => {

  // --- 1. State Management ---
  const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const state = {
    currentTool: 'brush', // 'brush', 'eraser'
    currentColor: '#6d4c41', // Chestnut
    brushSize: 16, // medium
    hairTexture: 'strands', // 'strands', 'silky', 'wavy', 'single'
    isDrawing: false,
    maskMode: true, // true: 'Hair Only', false: 'Free Draw'
    dollStyle: 'A', // 'A' or 'B'
    isMuted: false,
    history: [],
    redoStack: [],
    maxHistory: 20,
    currentGuide: 'straight', // default to 'straight' at start of game
    theme: savedTheme
  };

  // Apply initial theme immediately to prevent flashing
  if (state.theme === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }

  // --- 2. Canvas Setup ---
  const logicalWidth = 1024;
  const logicalHeight = 768;

  // Main visible canvas
  const displayCanvas = document.getElementById('display-canvas');
  const displayCtx = displayCanvas.getContext('2d');
  
  // Offscreen canvas layers
  const dollCanvas = document.createElement('canvas');
  const dollCtx = dollCanvas.getContext('2d');
  const hairCanvas = document.createElement('canvas');
  const hairCtx = hairCanvas.getContext('2d');
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
  const guideCanvas = document.createElement('canvas');
  const guideCtx = guideCanvas.getContext('2d');
  const compositeCanvas = document.createElement('canvas'); // For final composition
  const compositeCtx = compositeCanvas.getContext('2d');

  // Stroke engine variables
  let lastPoint = { x: 0, y: 0 };
  let lastVelocity = 0;
  let lastWidth = 0;
  let lastNormal = null;
  let strokeDirection = null;
  let lastAngle = null;
  let smoothedAngularVelocity = 0;
  let activeStrands = [];
  const STROKE_SMOOTHING = 0.5;

  // --- 3. Asset Definitions (Programmatic) ---
  const colors = [
    // Blacks & Greys
    '#0a0a0a', // Jet Black
    '#383838', // Off Black
    '#606060', // Dark Grey
    '#BDBDBD', // Silver
    // Browns
    '#3b2b21', // Dark Brown
    '#4e342e', // Chocolate
    '#6d4c41', // Chestnut
    '#967156', // Light Brown
    // Reds & Auburns
    '#5c2a1e', // Dark Auburn
    '#a54529', // Ginger Red
    '#cc6633', // Copper
    '#e59c6c', // Strawberry Blonde
    // Blondes
    '#b8976b', // Dark Blonde
    '#d4ac79', // Honey Blonde
    '#e6c89c', // Golden Blonde
    '#f0e1c3', // Platinum
    // White
    '#FFFFFF', '#F5F5F5' // White, Off-white
  ];

  const brushSizes = { small: 8, medium: 16, large: 32 };
  
  // --- 4. Audio System (Stubbed but functional) ---
  let audioCtx;
  let mainGain;
  const audioSystem = {
    init() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.value = state.isMuted ? 0 : 1;
      } catch (e) {
        console.warn("Web Audio API is not supported in this browser.");
      }
    },
    play(type) {
      if (!audioCtx || state.isMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      // Add a lowpass filter for softer, more luxurious sounds
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      
      oscillator.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(mainGain);
      
      const now = audioCtx.currentTime;
      
      switch(type) {
        case 'click':
          // Soft glass/wood tap
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(600, now);
          oscillator.frequency.exponentialRampToValueAtTime(300, now + 0.1);
          filter.frequency.setValueAtTime(1000, now);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.15, now + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          oscillator.start(now);
          oscillator.stop(now + 0.2);
          break;
        case 'paint':
          // Gentle, subtle chime
          oscillator.type = 'sine';
          const freq = 400 + Math.random() * 200;
          oscillator.frequency.setValueAtTime(freq, now);
          filter.frequency.setValueAtTime(800, now);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          oscillator.start(now);
          oscillator.stop(now + 0.15);
          break;
        case 'clear':
          // Soft descending sweep
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(400, now);
          oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.4);
          filter.frequency.setValueAtTime(600, now);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          oscillator.start(now);
          oscillator.stop(now + 0.5);
          break;
      }
    },
    toggleMute() {
      state.isMuted = !state.isMuted;
      if(mainGain) {
          mainGain.gain.setValueAtTime(state.isMuted ? 0 : 1, audioCtx.currentTime);
      }
      updateUI();
    }
  };

  // --- 5. Initialization ---
  function init() {
    setupCanvases();
    setupColorPalette();
    setupEventListeners();
    
    makeHairMask(state.dollStyle);
    drawDoll(state.dollStyle);
    drawGuide(state.currentGuide);
    updateUI();
    redrawAll();
    
    setTimeout(() => {
        document.getElementById('onboarding-overlay').classList.add('visible');
    }, 500);
  }

  function setupCanvases() {
    const dpr = window.devicePixelRatio || 1;
    const rect = displayCanvas.parentElement.getBoundingClientRect();
    
    const logicalAspect = logicalWidth / logicalHeight;
    const rectAspect = rect.width / rect.height;
    
    let displayWidth = rect.width;
    let displayHeight = rect.height;
    
    if (rectAspect > logicalAspect) {
      displayWidth = rect.height * logicalAspect;
    } else {
      displayHeight = rect.width / logicalAspect;
    }

    displayCanvas.width = displayWidth * dpr;
    displayCanvas.height = displayHeight * dpr;
    displayCtx.scale(dpr, dpr);
    
    displayCanvas.style.width = `${displayWidth}px`;
    displayCanvas.style.height = `${displayHeight}px`;
    displayCanvas.style.position = 'absolute';
    displayCanvas.style.left = `${(rect.width - displayWidth) / 2}px`;
    displayCanvas.style.top = `${(rect.height - displayHeight) / 2}px`;

    const canvases = [dollCanvas, hairCanvas, maskCanvas, guideCanvas, compositeCanvas];
    canvases.forEach(c => {
      c.width = logicalWidth;
      c.height = logicalHeight;
    });

    hairCtx.lineCap = 'round';
    hairCtx.lineJoin = 'round';
  }

  function setupColorPalette() {
    const palette = document.getElementById('color-palette');
    colors.forEach(color => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = color;
      swatch.dataset.color = color;
      swatch.addEventListener('click', () => {
        state.currentColor = color;
        audioSystem.play('click');
        updateUI();
      });
      palette.appendChild(swatch);
    });
  }

  // --- 6. Drawing Functions ---

  const dollImage = new Image();
  let isDollImageLoaded = false;
  dollImage.onload = () => {
    isDollImageLoaded = true;
    drawDoll(state.dollStyle);
    redrawAll();
  };
  dollImage.onerror = (e) => {
    console.error("Failed to load doll.png from " + dollImage.src, e);
    if (dollImage.src.indexOf('/doll.png') === -1) {
      dollImage.src = '/doll.png';
    }
  };
  const savedCustomDoll = localStorage.getItem('custom_doll_image');
  if (savedCustomDoll) {
    dollImage.src = savedCustomDoll;
  } else {
    dollImage.src = './doll.png';
  }

  function drawDoll(style) {
    dollCtx.clearRect(0, 0, logicalWidth, logicalHeight);
    
    if (isDollImageLoaded) {
      const imgWidth = dollImage.naturalWidth || dollImage.width;
      const imgHeight = dollImage.naturalHeight || dollImage.height;
      
      // Use scale to fit within the canvas, and let it take up as much space as possible
      const scale = Math.min(logicalWidth / imgWidth, logicalHeight / imgHeight);
      const drawWidth = imgWidth * scale;
      const drawHeight = imgHeight * scale;
      
      const drawX = (logicalWidth - drawWidth) / 2;
      const drawY = (logicalHeight - drawHeight) / 2;

      dollCtx.save();
      dollCtx.drawImage(dollImage, drawX, drawY, drawWidth, drawHeight);
      dollCtx.restore();
    }
  }

  function makeHairMask(style) {
    maskCtx.clearRect(0, 0, logicalWidth, logicalHeight);
    maskCtx.fillStyle = '#000';

    const w = logicalWidth;
    const h = logicalHeight;
    const centerX = w / 2;
    const cy = 290;

    // 1. Draw a very large rectangle covering the entire potential hair area
    maskCtx.fillRect(0, 0, w, h);

    // 2. Use destination-out to erase the face area from the mask
    maskCtx.globalCompositeOperation = 'destination-out';
    
    maskCtx.beginPath();
    maskCtx.ellipse(centerX, cy, 125, 160, 0, 0, Math.PI * 2);
    maskCtx.fill();
    
    // 3. Reset composite operation for future drawing
    maskCtx.globalCompositeOperation = 'source-over';
  }


  function drawGuide(type) {
    guideCtx.clearRect(0, 0, logicalWidth, logicalHeight);
    redrawAll();
  }

  // --- 7. Main Render Loop ---
  function redrawAll() {
    compositeCtx.clearRect(0, 0, logicalWidth, logicalHeight);
    
    // 1. Draw Doll
    compositeCtx.drawImage(dollCanvas, 0, 0);

    // 2. Draw Hair (with optional mask)
    if (state.maskMode) {
      // Create a temporary canvas for the masked hair effect
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = logicalWidth;
      tempCanvas.height = logicalHeight;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Draw the mask onto the temp canvas
      tempCtx.drawImage(maskCanvas, 0, 0);
      // Use the hair to fill the mask
      tempCtx.globalCompositeOperation = 'source-in';
      tempCtx.drawImage(hairCanvas, 0, 0);
      
      // Draw the masked result to the main composite canvas
      compositeCtx.drawImage(tempCanvas, 0, 0);

    } else {
      compositeCtx.drawImage(hairCanvas, 0, 0);
    }

    // 3. Draw guides on top
    compositeCtx.drawImage(guideCanvas, 0, 0);

    // 4. Scale and draw to visible canvas
    const displayWidth = parseFloat(displayCanvas.style.width);
    const displayHeight = parseFloat(displayCanvas.style.height);
    displayCtx.clearRect(0, 0, displayWidth, displayHeight);
    displayCtx.drawImage(compositeCanvas, 0, 0, displayWidth, displayHeight);
  }

  function getActualBrushSize() {
    if (state.currentGuide === 'curly' || state.currentGuide === 'kinky') {
      return state.brushSize * 0.8;
    }
    return state.brushSize;
  }

  // --- 7.5 Hair Strand & Texture Engine Helpers ---
  function hexToRgb(hex) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function adjustTone(rgb, factor) {
    if (factor > 0) {
      return {
        r: Math.min(255, Math.round(rgb.r + (255 - rgb.r) * factor)),
        g: Math.min(255, Math.round(rgb.g + (255 - rgb.g) * factor)),
        b: Math.min(255, Math.round(rgb.b + (255 - rgb.b) * factor))
      };
    } else {
      const f = 1 + factor;
      return {
        r: Math.max(0, Math.round(rgb.r * f)),
        g: Math.max(0, Math.round(rgb.g * f)),
        b: Math.max(0, Math.round(rgb.b * f))
      };
    }
  }

  function generateStrands(brushSize, textureType, hexColor) {
    const baseRgb = hexToRgb(hexColor);
    if (textureType === 'single') {
      return [{
        offset: 0,
        width: Math.max(1.2, Math.min(2.5, brushSize / 8)),
        color: `rgba(${baseRgb.r}, ${baseRgb.g}, ${baseRgb.b}, 0.9)`,
        rgb: baseRgb,
        baseAlpha: 0.9,
        taperEnd: 1.0,
        freq: 0.1,
        amp: 0.5,
        phase: 0
      }];
    }

    let count = Math.max(8, Math.round(brushSize * 0.9));
    if (textureType === 'silky') count = Math.max(12, Math.round(brushSize * 1.2));
    if (textureType === 'wavy') count = Math.max(7, Math.round(brushSize * 0.8));

    const strands = [];
    for (let i = 0; i < count; i++) {
      const u = (i / (count - 1 || 1)) - 0.5;
      const jitter = (Math.random() - 0.5) * (0.6 / count);
      const offset = Math.max(-0.48, Math.min(0.48, u + jitter));

      let factor = 0;
      let alpha = 0.78;
      const roll = Math.random();
      if (roll < 0.28) {
        factor = 0.18 + Math.random() * 0.22; // Highlight shine strand
        alpha = 0.85;
      } else if (roll < 0.54) {
        factor = -0.18 - Math.random() * 0.18; // Shadow depth strand
        alpha = 0.88;
      } else if (roll < 0.64) {
        factor = 0.38; // Specular luster strand
        alpha = 0.75;
      } else {
        factor = (Math.random() - 0.5) * 0.1; // Base strand with subtle natural variation
        alpha = 0.82;
      }

      if (textureType === 'silky') {
        alpha *= 0.85;
      }

      const c = adjustTone(baseRgb, factor);
      const colorStr = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha.toFixed(2)})`;

      const strandWidth = textureType === 'silky'
        ? 1.0 + Math.random() * 0.6
        : (textureType === 'wavy' ? 1.3 + Math.random() * 0.8 : 0.9 + Math.random() * 0.9);

      const freq = textureType === 'wavy' ? 0.08 + Math.random() * 0.04 : 0.15 + Math.random() * 0.1;
      const amp = textureType === 'wavy' ? (3.5 + Math.random() * 3.5) : (0.6 + Math.random() * 0.8);
      const phase = Math.random() * Math.PI * 2;

      // Feathered tips: outer and random strands end in staggered natural sequence
      const taperEnd = 0.78 + Math.random() * 0.22;

      strands.push({
        offset,
        width: strandWidth,
        color: colorStr,
        rgb: c,
        baseAlpha: alpha,
        taperEnd,
        freq,
        amp,
        phase
      });
    }

    strands.sort((a, b) => a.color.localeCompare(b.color));
    return strands;
  }

  // --- 8. Stroke Engine ---
  function getPointerPosition(e) {
    const rect = displayCanvas.getBoundingClientRect();
    const scaleX = logicalWidth / rect.width;
    const scaleY = logicalHeight / rect.height;
    
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function beginStroke(e) {
    if (e.cancelable) {
      e.preventDefault();
    }
    if (e.button && e.button !== 0) return; // Only left-click
    state.isDrawing = true;
    lastPoint = getPointerPosition(e);
    lastVelocity = 0;
    lastWidth = getActualBrushSize() * 0.4; // Natural tapered start
    lastNormal = null;
    strokeDirection = null;
    lastAngle = null;
    smoothedAngularVelocity = 0;
    state.strokeDistance = 0;
    activeStrands = generateStrands(getActualBrushSize(), state.hairTexture, state.currentColor);
    audioSystem.init(); // Init audio on first interaction
  }

  function extendStroke(e) {
    if (e.cancelable) {
      e.preventDefault();
    }
    if (!state.isDrawing) return;
    
    const currentPoint = getPointerPosition(e);
    const dx = currentPoint.x - lastPoint.x;
    const dy = currentPoint.y - lastPoint.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist === 0) return;

    // Track heading angle and smooth angular momentum for organic curved endings
    const currentAngle = Math.atan2(dy, dx);
    if (lastAngle !== null) {
      let dAngle = currentAngle - lastAngle;
      while (dAngle > Math.PI) dAngle -= Math.PI * 2;
      while (dAngle < -Math.PI) dAngle += Math.PI * 2;
      smoothedAngularVelocity = smoothedAngularVelocity * 0.65 + dAngle * 0.35;
    }
    lastAngle = currentAngle;
    strokeDirection = { dx: dx / dist, dy: dy / dist };

    const velocity = dist * STROKE_SMOOTHING + lastVelocity * (1 - STROKE_SMOOTHING);
    const actualSize = getActualBrushSize();
    
    // Dynamic pressure simulation: faster speed = thinner tapered hair lock
    const targetWidth = Math.max(actualSize / (1 + velocity / 14), actualSize * 0.35);
    const strokeWidth = lastWidth * 0.4 + targetWidth * 0.6;

    if (state.currentTool === 'eraser') {
      hairCtx.globalCompositeOperation = 'destination-out';
      hairCtx.lineWidth = strokeWidth;
      hairCtx.lineCap = 'round';
      hairCtx.lineJoin = 'round';
      hairCtx.beginPath();
      hairCtx.moveTo(lastPoint.x, lastPoint.y);
      hairCtx.lineTo(currentPoint.x, currentPoint.y);
      hairCtx.stroke();
    } else {
      hairCtx.globalCompositeOperation = 'source-over';
      hairCtx.lineCap = 'round';
      hairCtx.lineJoin = 'round';

      // Unit tangent & normal vectors
      const tx = dx / dist;
      const ty = dy / dist;
      const rawNx = -ty;
      const rawNy = tx;

      if (!lastNormal) {
        lastNormal = { nx: rawNx, ny: rawNy };
      }

      // Smooth normal vector across segments to eliminate angular bends
      const currNormal = {
        nx: lastNormal.nx * 0.3 + rawNx * 0.7,
        ny: lastNormal.ny * 0.3 + rawNy * 0.7
      };
      const nLen = Math.hypot(currNormal.nx, currNormal.ny) || 1;
      currNormal.nx /= nLen;
      currNormal.ny /= nLen;

      // Soft underlying lock volume for realistic hair body
      if (state.hairTexture !== 'single') {
        const baseRgb = hexToRgb(state.currentColor);
        const coreAlpha = state.hairTexture === 'silky' ? 0.28 : 0.16;
        hairCtx.strokeStyle = `rgba(${baseRgb.r}, ${baseRgb.g}, ${baseRgb.b}, ${coreAlpha})`;
        hairCtx.lineWidth = strokeWidth * 0.7;
        hairCtx.beginPath();
        hairCtx.moveTo(lastPoint.x, lastPoint.y);
        hairCtx.lineTo(currentPoint.x, currentPoint.y);
        hairCtx.stroke();
      }

      // Render individual hair fiber strands with tone variation, highlights, and organic flow
      const steps = Math.max(1, Math.min(5, Math.ceil(dist / 4)));

      for (let i = 0; i < activeStrands.length; i++) {
        const strand = activeStrands[i];
        hairCtx.strokeStyle = strand.color;
        hairCtx.lineWidth = strand.width;
        hairCtx.beginPath();

        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const px = lastPoint.x + dx * t;
          const py = lastPoint.y + dy * t;
          const w = lastWidth + (strokeWidth - lastWidth) * t;
          const d = state.strokeDistance + dist * t;

          const inx = lastNormal.nx + (currNormal.nx - lastNormal.nx) * t;
          const iny = lastNormal.ny + (currNormal.ny - lastNormal.ny) * t;

          let wobble = Math.sin(d * strand.freq + strand.phase) * strand.amp;
          
          if (state.currentGuide === 'straight') {
            // Type 1 (Straight): Sleek, uniform alignment with zero wave
            wobble = 0;
          } else if (state.currentGuide === 'wavy') {
            // Type 2 (Wavy): Flowing rhythmic S-waves (2a/2b/2c)
            const waveAmp = Math.max(7, strokeWidth * 0.9);
            const waveAngle = d * 0.07;
            wobble += Math.sin(waveAngle) * waveAmp;
          } else if (state.currentGuide === 'curly') {
            // Type 3 (Curly): Spiral ringlet loops and springy corkscrews (3a/3b/3c)
            const curlRadius = Math.max(8, strokeWidth * 1.15);
            const curlAngle = d * 0.18;
            wobble += Math.cos(curlAngle) * curlRadius;
          } else if (state.currentGuide === 'kinky') {
            // Type 4 (Kinky): High-density zigzag Z-pattern crinkles and micro-coils (4a/4b/4c)
            const kinkyAmp = Math.max(5, strokeWidth * 0.7);
            const kinkyFreq = 0.38;
            const phase = (d * kinkyFreq) % (Math.PI * 2);
            const zigzag = (Math.asin(Math.sin(phase)) / (Math.PI / 2)); // sharp triangular wave -1 to +1
            wobble += zigzag * kinkyAmp;
          }

          const sx = px + inx * (strand.offset * w + wobble);
          const sy = py + iny * (strand.offset * w + wobble);

          if (s === 0) {
            hairCtx.moveTo(sx, sy);
          } else {
            hairCtx.lineTo(sx, sy);
          }
        }
        hairCtx.stroke();
      }

      lastNormal = currNormal;
    }
    
    lastPoint = currentPoint;
    lastVelocity = velocity;
    lastWidth = strokeWidth;
    state.strokeDistance += dist;
    
    requestAnimationFrame(redrawAll);
  }

  // Finishes every hair brush stroke with an organic, gradual taper down to almost nothing
  function finishHairStrokeTaper() {
    if (!lastPoint) return;

    // Trajectory angle and smooth curvature dissipation
    let angle = lastAngle !== null ? lastAngle : Math.PI / 2;
    let angVel = Math.max(-0.06, Math.min(0.06, smoothedAngularVelocity || 0));

    const actualSize = getActualBrushSize();
    const startWidth = Math.max(lastWidth || 0, actualSize * 0.45);

    // Natural taper length proportional to brush width and movement speed
    const taperLength = Math.max(22, Math.min(68, startWidth * 1.6 + (lastVelocity || 0) * 1.3));
    const steps = 22;
    const stepDist = taperLength / steps;

    let currX = lastPoint.x;
    let currY = lastPoint.y;
    let prevNormal = lastNormal;

    if (state.currentTool === 'eraser') {
      hairCtx.globalCompositeOperation = 'destination-out';
      hairCtx.lineCap = 'round';
      hairCtx.lineJoin = 'round';
      for (let k = 0; k < steps; k++) {
        const prog = k / steps;
        angVel *= 0.94;
        angle += angVel;
        const nextX = currX + Math.cos(angle) * stepDist;
        const nextY = currY + Math.sin(angle) * stepDist;
        const ew = Math.max(0.2, startWidth * Math.pow(1 - prog, 1.8));
        hairCtx.lineWidth = ew;
        hairCtx.beginPath();
        hairCtx.moveTo(currX, currY);
        hairCtx.lineTo(nextX, nextY);
        hairCtx.stroke();
        currX = nextX;
        currY = nextY;
      }
      lastPoint = { x: currX, y: currY };
      state.strokeDistance += taperLength;
      return;
    }

    hairCtx.globalCompositeOperation = 'source-over';
    hairCtx.lineCap = 'round';
    hairCtx.lineJoin = 'round';

    const strands = activeStrands.length > 0 ? activeStrands : generateStrands(actualSize, state.hairTexture, state.currentColor);

    for (let k = 0; k < steps; k++) {
      const pStart = k / steps;
      const pEnd = (k + 1) / steps;

      angVel *= 0.93; // Gracefully relax curvature
      angle += angVel;

      const nextX = currX + Math.cos(angle) * stepDist;
      const nextY = currY + Math.sin(angle) * stepDist;

      const tx = Math.cos(angle);
      const ty = Math.sin(angle);
      const rawNx = -ty;
      const rawNy = tx;

      const currNormal = prevNormal ? {
        nx: prevNormal.nx * 0.35 + rawNx * 0.65,
        ny: prevNormal.ny * 0.35 + rawNy * 0.65
      } : { nx: rawNx, ny: rawNy };
      const nLen = Math.hypot(currNormal.nx, currNormal.ny) || 1;
      currNormal.nx /= nLen;
      currNormal.ny /= nLen;

      // Concave width reduction finishing down to zero
      const w1 = startWidth * Math.pow(1 - pStart, 1.6);
      const w2 = startWidth * Math.pow(1 - pEnd, 1.6);

      // Core lock body volume fades out completely to nothing
      if (state.hairTexture !== 'single') {
        const baseRgb = hexToRgb(state.currentColor);
        const coreAlphaBase = state.hairTexture === 'silky' ? 0.28 : 0.16;
        const coreAlpha = coreAlphaBase * Math.pow(1 - pEnd, 2.2);
        if (coreAlpha > 0.005 && w2 > 0.3) {
          hairCtx.strokeStyle = `rgba(${baseRgb.r}, ${baseRgb.g}, ${baseRgb.b}, ${coreAlpha.toFixed(3)})`;
          hairCtx.lineWidth = Math.max(0.1, w1 * 0.7);
          hairCtx.beginPath();
          hairCtx.moveTo(currX, currY);
          hairCtx.lineTo(nextX, nextY);
          hairCtx.stroke();
        }
      }

      // Render tapered individual hair strands ending gradually to almost nothing
      const d1 = state.strokeDistance + k * stepDist;
      const d2 = state.strokeDistance + (k + 1) * stepDist;

      for (let i = 0; i < strands.length; i++) {
        const strand = strands[i];
        const tEnd = strand.taperEnd || 0.92;

        if (pStart >= tEnd) {
          // This strand has finished in natural feathering sequence
          continue;
        }

        const sp1 = pStart / tEnd;
        const sp2 = Math.min(1, pEnd / tEnd);

        // Alpha fades gradually to nothing (0)
        const alpha = (strand.baseAlpha || 0.8) * Math.pow(1 - sp2, 1.7);
        if (alpha < 0.008) continue;

        // Strand width tapers down to microscopic hair tip
        const strandW = Math.max(0.1, strand.width * Math.pow(1 - sp1, 1.3));

        const rgb = strand.rgb || hexToRgb(state.currentColor);
        hairCtx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha.toFixed(3)})`;
        hairCtx.lineWidth = strandW;

        // Strands converge inwards towards the tip
        const conv1 = Math.pow(1 - sp1, 1.25);
        const conv2 = Math.pow(1 - sp2, 1.25);

        let wobble1 = Math.sin(d1 * strand.freq + strand.phase) * strand.amp * (1 - sp1);
        let wobble2 = Math.sin(d2 * strand.freq + strand.phase) * strand.amp * (1 - sp2);

        if (state.currentGuide === 'straight') {
          wobble1 = 0;
          wobble2 = 0;
        } else if (state.currentGuide === 'wavy') {
          const waveAmp = Math.max(7, startWidth * 0.9) * (1 - sp1);
          wobble1 += Math.sin(d1 * 0.07) * waveAmp;
          wobble2 += Math.sin(d2 * 0.07) * (waveAmp * (1 - sp2));
        } else if (state.currentGuide === 'curly') {
          const curlRadius = Math.max(8, startWidth * 1.15) * (1 - sp1);
          wobble1 += Math.cos(d1 * 0.18) * curlRadius;
          wobble2 += Math.cos(d2 * 0.18) * (curlRadius * (1 - sp2));
        } else if (state.currentGuide === 'kinky') {
          const kinkyAmp = Math.max(5, startWidth * 0.7) * (1 - sp1);
          const phase1 = (d1 * 0.38) % (Math.PI * 2);
          const phase2 = (d2 * 0.38) % (Math.PI * 2);
          const zigzag1 = (Math.asin(Math.sin(phase1)) / (Math.PI / 2));
          const zigzag2 = (Math.asin(Math.sin(phase2)) / (Math.PI / 2));
          wobble1 += zigzag1 * kinkyAmp;
          wobble2 += zigzag2 * (kinkyAmp * (1 - sp2));
        }

        const sx1 = currX + currNormal.nx * (strand.offset * w1 * conv1 + wobble1);
        const sy1 = currY + currNormal.ny * (strand.offset * w1 * conv1 + wobble1);
        const sx2 = nextX + currNormal.nx * (strand.offset * w2 * conv2 + wobble2);
        const sy2 = nextY + currNormal.ny * (strand.offset * w2 * conv2 + wobble2);

        hairCtx.beginPath();
        hairCtx.moveTo(sx1, sy1);
        hairCtx.lineTo(sx2, sy2);
        hairCtx.stroke();
      }

      currX = nextX;
      currY = nextY;
      prevNormal = currNormal;
    }

    lastPoint = { x: currX, y: currY };
    state.strokeDistance += taperLength;
  }

  function endStroke() {
    if (!state.isDrawing) return;

    finishHairStrokeTaper();

    state.isDrawing = false;
    lastNormal = null;
    activeStrands = [];
    strokeDirection = null;
    lastAngle = null;
    smoothedAngularVelocity = 0;
    pushHistory();
    redrawAll();
  }

  // --- 9. History Management (Undo/Redo) ---
  function pushHistory() {
    state.redoStack = []; // Clear redo stack on new action
    if (state.history.length >= state.maxHistory) {
      state.history.shift(); // Remove oldest entry
    }
    const imgData = hairCtx.getImageData(0, 0, logicalWidth, logicalHeight);
    state.history.push(imgData);
    updateUI();
  }

  function undo() {
    if (state.history.length > 1) { // Keep the initial blank state
      const lastState = state.history.pop();
      state.redoStack.push(lastState);
      
      const prevState = state.history[state.history.length-1];
      hairCtx.clearRect(0, 0, logicalWidth, logicalHeight);
      if (prevState) {
          hairCtx.putImageData(prevState, 0, 0);
      }
      
      redrawAll();
      updateUI();
      audioSystem.play('click');
    }
  }

  function redo() {
    if (state.redoStack.length > 0) {
      const nextState = state.redoStack.pop();
      state.history.push(nextState);
      hairCtx.putImageData(nextState, 0, 0);
      redrawAll();
      updateUI();
      audioSystem.play('click');
    }
  }
  
  // Initialize with a blank state
  setTimeout(() => {
    const blankState = hairCtx.getImageData(0, 0, logicalWidth, logicalHeight);
    state.history.push(blankState);
    updateUI();
  }, 0);


  // --- 10. UI Handlers & Updaters ---

  function updateUI() {
    const isDark = document.documentElement.classList.contains('dark');

    // Tools
    document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tool-${state.currentTool}`)?.classList.add('active');
    
    // Brush sizes
    document.getElementById('brush-small').classList.toggle('active', state.brushSize === brushSizes.small);
    document.getElementById('brush-medium').classList.toggle('active', state.brushSize === brushSizes.medium);
    document.getElementById('brush-large').classList.toggle('active', state.brushSize === brushSizes.large);

    // Hair Types (Straight, Wavy, Curly, Kinky)
    ['straight', 'wavy', 'curly', 'kinky'].forEach(type => {
      const btn = document.getElementById(`guide-${type}`);
      if (btn) {
        btn.classList.toggle('active', state.currentGuide === type);
      }
    });
    
    // Hair Textures
    ['strands', 'silky', 'wavy', 'single'].forEach(texture => {
      const btn = document.getElementById(`texture-${texture}`);
      if (btn) {
        btn.classList.toggle('active', state.hairTexture === texture);
      }
    });

    // Brush Preview Canvas
    drawBrushPreview();

    // Theme Toggle Icons
    const lightIcon = document.getElementById('theme-icon-light');
    const darkIcon = document.getElementById('theme-icon-dark');
    if (lightIcon && darkIcon) {
      lightIcon.style.display = isDark ? 'none' : 'block';
      darkIcon.style.display = isDark ? 'block' : 'none';
    }

    // Color Palette
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.classList.toggle('active', swatch.dataset.color === state.currentColor);
    });
    
    // Undo/Redo Buttons
    document.getElementById('undo-btn').disabled = state.history.length <= 1;
    document.getElementById('redo-btn').disabled = state.redoStack.length === 0;

    // Mask Toggle
    const maskBtn = document.getElementById('mask-toggle');
    maskBtn.classList.toggle('active', state.maskMode);
    maskBtn.querySelector('span').textContent = state.maskMode ? 'Hair Only' : 'Free Draw';
    
    // Doll Toggle
    const dollBtn = document.getElementById('doll-toggle');
    dollBtn.querySelector('span').textContent = `Style ${state.dollStyle}`;

    // Custom doll reset button
    const hasCustomDoll = !!localStorage.getItem('custom_doll_image');
    const resetDollBtn = document.getElementById('reset-doll-btn');
    if (resetDollBtn) {
      resetDollBtn.style.display = hasCustomDoll ? 'inline-flex' : 'none';
    }

    // Mute Toggle
    document.getElementById('mute-icon').style.display = state.isMuted ? 'none' : 'block';
    document.getElementById('unmute-icon').style.display = state.isMuted ? 'block' : 'none';

    // Status strip
    const typeLabel = state.currentGuide ? ` | Type: ${state.currentGuide.charAt(0).toUpperCase() + state.currentGuide.slice(1)}` : '';
    document.getElementById('status-strip').textContent =
      `Tool: ${state.currentTool === 'eraser' ? 'Eraser' : 'Brush (' + state.hairTexture + ')'}${typeLabel} | Color: ${state.currentColor} | Size: ${Math.round(getActualBrushSize())}px | Mode: ${state.maskMode ? 'Hair Only' : 'Free Draw'}`;
  }

  function drawBrushPreview() {
    const previewCanvas = document.getElementById('brush-preview-canvas');
    if (!previewCanvas) return;
    const pCtx = previewCanvas.getContext('2d');
    pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

    if (state.currentTool === 'eraser') {
      const actualSize = getActualBrushSize();
      const r = Math.max(3, Math.min(22, actualSize * 0.7));
      pCtx.fillStyle = 'rgba(150, 150, 150, 0.2)';
      pCtx.beginPath();
      pCtx.arc(28, 28, r, 0, Math.PI * 2);
      pCtx.fill();
      pCtx.lineWidth = 1.5;
      pCtx.strokeStyle = 'var(--text-light)';
      pCtx.stroke();
      return;
    }

    const sampleSize = getActualBrushSize();
    const sampleStrands = generateStrands(sampleSize, state.hairTexture, state.currentColor);

    // Soft underlying lock volume for realistic hair body
    if (state.hairTexture !== 'single') {
      const rgb = hexToRgb(state.currentColor);
      pCtx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${state.hairTexture === 'silky' ? 0.35 : 0.2})`;
      pCtx.lineWidth = Math.min(24, sampleSize * 0.75);
      pCtx.lineCap = 'round';
      pCtx.beginPath();
      pCtx.moveTo(28, 8);
      pCtx.bezierCurveTo(34, 22, 22, 34, 28, 48);
      pCtx.stroke();
    }

    pCtx.lineCap = 'round';
    for (let i = 0; i < sampleStrands.length; i++) {
      const strand = sampleStrands[i];
      const rgb = strand.rgb || hexToRgb(state.currentColor);

      for (let s = 0; s < 16; s++) {
        const t1 = s / 16;
        const t2 = (s + 1) / 16;
        const y1 = 8 + t1 * 40;
        const y2 = 8 + t2 * 40;

        let midCurve1 = 0;
        let midCurve2 = 0;
        if (state.currentGuide === 'straight') {
          midCurve1 = 0;
          midCurve2 = 0;
        } else if (state.currentGuide === 'wavy' || (!state.currentGuide && state.hairTexture === 'wavy')) {
          midCurve1 = Math.sin(t1 * Math.PI * 2.2) * 7;
          midCurve2 = Math.sin(t2 * Math.PI * 2.2) * 7;
        } else if (state.currentGuide === 'curly') {
          midCurve1 = Math.cos(t1 * Math.PI * 3.5) * 6;
          midCurve2 = Math.cos(t2 * Math.PI * 3.5) * 6;
        } else if (state.currentGuide === 'kinky') {
          const p1 = (t1 * 22) % (Math.PI * 2);
          const p2 = (t2 * 22) % (Math.PI * 2);
          midCurve1 = (Math.asin(Math.sin(p1)) / (Math.PI / 2)) * 5;
          midCurve2 = (Math.asin(Math.sin(p2)) / (Math.PI / 2)) * 5;
        } else {
          midCurve1 = Math.sin(t1 * Math.PI) * 3;
          midCurve2 = Math.sin(t2 * Math.PI) * 3;
        }

        // Taper strand offset and amplitude towards the end
        const taperEnd1 = t1 > 0.55 ? Math.pow((1 - t1) / 0.45, 1.3) : 1;
        const taperEnd2 = t2 > 0.55 ? Math.pow((1 - t2) / 0.45, 1.3) : 1;

        const wobble1 = state.currentGuide === 'straight' ? 0 : Math.sin(t1 * 12 + strand.phase) * (strand.amp * 0.4) * taperEnd1;
        const wobble2 = state.currentGuide === 'straight' ? 0 : Math.sin(t2 * 12 + strand.phase) * (strand.amp * 0.4) * taperEnd2;

        const x1 = 28 + midCurve1 + strand.offset * Math.min(30, sampleSize * 0.9) * taperEnd1 + wobble1;
        const x2 = 28 + midCurve2 + strand.offset * Math.min(30, sampleSize * 0.9) * taperEnd2 + wobble2;

        // Taper strand width and fade alpha gradually to almost nothing at the end
        const strandAlpha = (strand.baseAlpha || 0.8) * (t2 > 0.6 ? Math.pow((1 - t2) / 0.4, 1.5) : 1);
        const strandWidth = Math.max(0.1, strand.width * (t2 > 0.55 ? Math.pow((1 - t2) / 0.45, 1.2) : 1));

        pCtx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${strandAlpha.toFixed(2)})`;
        pCtx.lineWidth = strandWidth;
        pCtx.beginPath();
        pCtx.moveTo(x1, y1);
        pCtx.lineTo(x2, y2);
        pCtx.stroke();
      }
    }
  }

  function setTool(tool) {
    state.currentTool = tool;
    updateUI();
    audioSystem.play('click');
  }

  function setBrushSize(size) {
    state.brushSize = brushSizes[size];
    updateUI();
    audioSystem.play('click');
  }

  function clearHair() {
    hairCtx.clearRect(0, 0, logicalWidth, logicalHeight);
    pushHistory();
    redrawAll();
    audioSystem.play('clear');
  }

  function exportPNG() {
    const exportResolution = 2;
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = logicalWidth * exportResolution;
    exportCanvas.height = logicalHeight * exportResolution;
    const exportCtx = exportCanvas.getContext('2d');
    
    exportCtx.scale(exportResolution, exportResolution);

    // Draw final composition to export canvas
    exportCtx.drawImage(compositeCanvas, 0, 0);

    // Trigger download
    const link = document.createElement('a');
    link.download = 'hair-designer.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
    audioSystem.play('click');
  }

  // --- 11. Event Listeners ---
  function setupEventListeners() {
    // Theme Switcher
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        state.theme = currentTheme;
        localStorage.setItem('theme', currentTheme);
        
        if (currentTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        
        drawDoll(state.dollStyle);
        redrawAll();
        updateUI();
        audioSystem.play('click');
      });
    }

    // Drawing events
    displayCanvas.addEventListener('mousedown', beginStroke);
    displayCanvas.addEventListener('mousemove', extendStroke);
    document.addEventListener('mouseup', endStroke);
    displayCanvas.addEventListener('touchstart', beginStroke, { passive: false });
    displayCanvas.addEventListener('touchmove', extendStroke, { passive: false });
    document.addEventListener('touchend', endStroke);
    document.addEventListener('touchcancel', endStroke);
    window.addEventListener('blur', endStroke);

    // Tool selection
    document.getElementById('tool-brush').addEventListener('click', () => setTool('brush'));
    document.getElementById('tool-eraser').addEventListener('click', () => setTool('eraser'));
    document.getElementById('brush-small').addEventListener('click', () => setBrushSize('small'));
    document.getElementById('brush-medium').addEventListener('click', () => setBrushSize('medium'));
    document.getElementById('brush-large').addEventListener('click', () => setBrushSize('large'));

    // Hair Texture Selection
    ['strands', 'silky', 'wavy', 'single'].forEach(texture => {
      const btn = document.getElementById(`texture-${texture}`);
      if (btn) {
        btn.addEventListener('click', () => {
          state.hairTexture = texture;
          if (state.currentTool !== 'brush') {
            state.currentTool = 'brush';
          }
          updateUI();
          audioSystem.play('click');
        });
      }
    });

    // History
    document.getElementById('undo-btn').addEventListener('click', undo);
    document.getElementById('redo-btn').addEventListener('click', redo);

    // Controls
    document.getElementById('clear-btn').addEventListener('click', clearHair);
    document.getElementById('save-btn').addEventListener('click', exportPNG);
    document.getElementById('mute-btn').addEventListener('click', audioSystem.toggleMute);
    
    document.getElementById('mask-toggle').addEventListener('click', () => {
        state.maskMode = !state.maskMode;
        redrawAll();
        updateUI();
        audioSystem.play('click');
    });

    document.getElementById('doll-toggle').addEventListener('click', () => {
        state.dollStyle = state.dollStyle === 'A' ? 'B' : 'A';
        drawDoll(state.dollStyle);
        makeHairMask(state.dollStyle);
        redrawAll();
        updateUI();
        audioSystem.play('click');
    });

    // Custom Doll Upload & Drag-and-Drop
    const uploadDollBtn = document.getElementById('upload-doll-btn');
    const dollFileInput = document.getElementById('doll-file-input');
    const resetDollBtn = document.getElementById('reset-doll-btn');

    if (uploadDollBtn && dollFileInput) {
      uploadDollBtn.addEventListener('click', () => {
        dollFileInput.click();
      });

      dollFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target.result;
            try {
              localStorage.setItem('custom_doll_image', dataUrl);
            } catch (err) {
              console.warn('Could not save to localStorage', err);
            }
            dollImage.src = dataUrl;
            updateUI();
            audioSystem.play('click');
          };
          reader.readAsDataURL(file);
        }
      });
    }

    if (resetDollBtn) {
      resetDollBtn.addEventListener('click', () => {
        localStorage.removeItem('custom_doll_image');
        dollImage.src = './doll.png';
        updateUI();
        audioSystem.play('click');
      });
    }

    // Drag and Drop custom doll onto canvas wrapper
    const canvasWrapper = document.getElementById('canvas-wrapper');
    if (canvasWrapper) {
      canvasWrapper.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      canvasWrapper.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              const dataUrl = event.target.result;
              try {
                localStorage.setItem('custom_doll_image', dataUrl);
              } catch (err) {
                console.warn('Could not save to localStorage', err);
              }
              dollImage.src = dataUrl;
              updateUI();
              audioSystem.play('click');
            };
            reader.readAsDataURL(file);
          }
        }
      });
    }

    // Hair Types (Straight, Wavy, Curly, Kinky)
    ['straight', 'wavy', 'curly', 'kinky'].forEach(guide => {
        const btn = document.getElementById(`guide-${guide}`);
        if (btn) {
          btn.addEventListener('click', () => {
            state.currentGuide = state.currentGuide === guide ? null : guide;
            drawGuide(state.currentGuide);
            updateUI();
            audioSystem.play('click');
          });
        }
    });

    // Onboarding
    let onboardingStep = 0;
    const onboardingOverlay = document.getElementById('onboarding-overlay');
    const onboardingTitle = document.getElementById('onboarding-title');
    const onboardingText = document.getElementById('onboarding-text');
    const onboardingNext = document.getElementById('onboarding-next');
    onboardingNext.addEventListener('click', () => {
      onboardingStep++;
      if (onboardingStep === 1) {
        onboardingTitle.textContent = "Time to Paint!";
        onboardingText.textContent = "Now use your finger or mouse to draw the doll's hair. Have fun!";
        onboardingNext.textContent = "Start Drawing!";
      } else {
        onboardingOverlay.classList.remove('visible');
      }
      audioSystem.init(); // ensure audio is ready
      audioSystem.play('click');
    });

    // Window resize (debounced)
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        setupCanvases();
        redrawAll();
      }, 250);
    });
  }

  // --- And... GO! ---
  init();

});
</script>
</body>
</html>
